{{ define "main" }}

<section>
	{{ .Content }}

	{{ range .Pages }}
    <a href="{{ .RelPermalink }}" style="color: var(--heading-color)">{{ .LinkTitle }}</a>
    <em style="float: right">/ {{ .Date | time.Format "2 Jan 2006"}} /</em>

    <p>{{.Summary}}</p>
    <hr />
  {{ end }}
</section>

{{ end }}
